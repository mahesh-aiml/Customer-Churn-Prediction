<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Telco Customer Churn animated header" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b">
        <animate attributeName="stop-color" values="#0b132b;#1b1464;#0b132b" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#1c2541">
        <animate attributeName="stop-color" values="#1c2541;#3a0ca3;#1c2541" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0f4c75">
        <animate attributeName="stop-color" values="#0f4c75;#0b132b;#0f4c75" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.6" stop-color="#4cc9f0"/>
      <stop offset="1" stop-color="#f72585"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ad1ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="900" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="280" fill="url(#bg)"/>

    <!-- grid -->
    <g stroke="#ffffff" stroke-opacity="0.05">
      <path d="M0 70H900M0 140H900M0 210H900"/>
      <path d="M150 0V280M300 0V280M450 0V280M600 0V280M750 0V280"/>
    </g>

    <!-- floating particles -->
    <g fill="#4cc9f0" opacity="0.5">
      <circle cx="80" cy="60" r="4"><animate attributeName="cy" values="60;40;60" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="230" r="3"><animate attributeName="cy" values="230;205;230" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="40" r="3"><animate attributeName="cy" values="40;62;40" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="250" r="5"><animate attributeName="cy" values="250;225;250" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="810" cy="50" r="4"><animate attributeName="cy" values="50;78;50" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="200" r="3"><animate attributeName="cy" values="200;180;200" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#f72585" opacity="0.55">
      <circle cx="150" cy="120" r="3"><animate attributeName="cy" values="120;100;120" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="120" r="4"><animate attributeName="cy" values="120;145;120" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="235" r="3"><animate attributeName="cy" values="235;215;235" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- self-drawing retention/churn curve -->
    <path d="M0 215 C90 205 140 150 230 160 S370 215 470 170 S640 90 760 120 S850 175 900 140"
          fill="none" stroke="url(#curve)" stroke-width="4" stroke-linecap="round"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000" filter="url(#glow)" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;0.45;0.85;1" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- moving dot riding the curve -->
    <circle r="7" fill="#ffffff" filter="url(#glow)">
      <animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.45;0.85;1" calcMode="linear"
        path="M0 215 C90 205 140 150 230 160 S370 215 470 170 S640 90 760 120 S850 175 900 140"/>
    </circle>

    <!-- title -->
    <g>
      <text x="450" y="118" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#title)" filter="url(#glow)">
        Telco Customer Churn
        <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur="1.4s" fill="freeze"/>
      </text>
      <text x="450" y="160" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" letter-spacing="8" fill="#9ad1ff">
        PREDICT  •  PREVENT  •  RETAIN
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="2.4s" fill="freeze"/>
      </text>
      <text x="450" y="196" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" fill-opacity="0.65">
        Supervised Learning  |  SMOTE  |  4-Model Comparison  |  scikit-learn
        <animate attributeName="opacity" values="0;0;0.9" keyTimes="0;0.7;1" dur="3.2s" fill="freeze"/>
      </text>
    </g>
  </g>
</svg>
