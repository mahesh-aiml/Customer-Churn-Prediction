<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="Animated ML pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="1" stop-color="#f72585"/>
    </linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="210" rx="18" fill="#0d1321"/>

  <!-- track -->
  <line x1="70" y1="105" x2="830" y2="105" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <line x1="70" y1="105" x2="830" y2="105" stroke="url(#flow)" stroke-width="3" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" values="36;0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- data packets -->
  <g fill="#ffffff" filter="url(#g)">
    <circle r="5"><animateMotion dur="6s" repeatCount="indefinite" path="M70 105 H830"/></circle>
    <circle r="5"><animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M70 105 H830"/></circle>
    <circle r="5"><animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M70 105 H830"/></circle>
  </g>

  <!-- nodes -->
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="70" cy="105" r="30" fill="#14213d" stroke="#00f5d4" stroke-width="3">
        <animate attributeName="r" values="30;34;30" dur="3s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="70" y="113" font-size="24">📥</text>
      <text x="70" y="160" font-size="13" fill="#e0e6f0" font-weight="600">Load Data</text>
      <text x="70" y="177" font-size="11" fill="#8d99ae">7,043 rows</text>
    </g>
    <g>
      <circle cx="197" cy="105" r="30" fill="#14213d" stroke="#2ee6c5" stroke-width="3">
        <animate attributeName="r" values="30;34;30" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="197" y="113" font-size="24">🧹</text>
      <text x="197" y="160" font-size="13" fill="#e0e6f0" font-weight="600">Clean + Engineer</text>
      <text x="197" y="177" font-size="11" fill="#8d99ae">3 new features</text>
    </g>
    <g>
      <circle cx="323" cy="105" r="30" fill="#14213d" stroke="#4cc9f0" stroke-width="3">
        <animate attributeName="r" values="30;34;30" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="323" y="113" font-size="24">✂️</text>
      <text x="323" y="160" font-size="13" fill="#e0e6f0" font-weight="600">Stratified Split</text>
      <text x="323" y="177" font-size="11" fill="#8d99ae">80 / 20</text>
    </g>
    <g>
      <circle cx="450" cy="105" r="30" fill="#14213d" stroke="#a78bfa" stroke-width="3">
        <animate attributeName="r" values="30;34;30" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="450" y="113" font-size="24">⚖️</text>
      <text x="450" y="160" font-size="13" fill="#e0e6f0" font-weight="600">SMOTE</text>
      <text x="450" y="177" font-size="11" fill="#8d99ae">train only</text>
    </g>
    <g>
      <circle cx="577" cy="105" r="30" fill="#14213d" stroke="#f9c74f" stroke-width="3">
        <animate attributeName="r" values="30;34;30" dur="3s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <text x="577" y="113" font-size="24">🤖</text>
      <text x="577" y="160" font-size="13" fill="#e0e6f0" font-weight="600">Train Models</text>
      <text x="577" y="177" font-size="11" fill="#8d99ae">NB • DT • KNN • SVM</text>
    </g>
    <g>
      <circle cx="703" cy="105" r="30" fill="#14213d" stroke="#f8961e" stroke-width="3">
        <animate attributeName="r" values="30;34;30" dur="3s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="703" y="113" font-size="24">📊</text>
      <text x="703" y="160" font-size="13" fill="#e0e6f0" font-weight="600">Evaluate</text>
      <text x="703" y="177" font-size="11" fill="#8d99ae">untouched test set</text>
    </g>
    <g>
      <circle cx="830" cy="105" r="30" fill="#14213d" stroke="#f72585" stroke-width="3">
        <animate attributeName="r" values="30;34;30" dur="3s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <text x="830" y="113" font-size="24">📞</text>
      <text x="830" y="160" font-size="13" fill="#e0e6f0" font-weight="600">Retain</text>
      <text x="830" y="177" font-size="11" fill="#8d99ae">act on predictions</text>
    </g>
  </g>

  <text x="450" y="40" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">End-to-End ML Pipeline</text>
</svg>
