<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Animated recall and precision comparison of four models" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="rec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b4d8"/>
      <stop offset="1" stop-color="#00f5d4"/>
    </linearGradient>
    <linearGradient id="pre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f77f00"/>
      <stop offset="1" stop-color="#fcbf49"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="420" rx="18" fill="#0d1321"/>
  <text x="30" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Churn-class Recall vs Precision (test set)</text>

  <!-- legend -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#e0e6f0">
    <rect x="640" y="28" width="14" height="14" rx="3" fill="url(#rec)"/>
    <text x="662" y="40">Recall</text>
    <rect x="730" y="28" width="14" height="14" rx="3" fill="url(#pre)"/>
    <text x="752" y="40">Precision</text>
  </g>

  <!-- axis guides (0, 0.25, 0.5, 0.75, 1.0) bar area x=180..680 -->
  <g stroke="#ffffff" stroke-opacity="0.08">
    <path d="M180 70V390M305 70V390M430 70V390M555 70V390M680 70V390"/>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#8d99ae" text-anchor="middle">
    <text x="180" y="408">0</text><text x="305" y="408">0.25</text><text x="430" y="408">0.50</text><text x="555" y="408">0.75</text><text x="680" y="408">1.00</text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- Gaussian NB -->
    <text x="30" y="108" font-size="15" font-weight="700" fill="#ffffff">Gaussian NB</text>
    <text x="30" y="127" font-size="11" fill="#8d99ae">AUC 0.815</text>
    <rect x="180" y="88" height="24" rx="6" fill="url(#rec)" filter="url(#g)" width="0">
      <animate attributeName="width" from="0" to="413.1" dur="1.4s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="600" y="106" font-size="13" font-weight="700" fill="#00f5d4" opacity="0">0.826 ★ best recall
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
    </text>
    <rect x="180" y="118" height="24" rx="6" fill="url(#pre)" width="0">
      <animate attributeName="width" from="0" to="234.8" dur="1.4s" begin="0.15s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="425" y="136" font-size="13" fill="#fcbf49" opacity="0">0.470
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
    </text>

    <!-- Decision Tree -->
    <text x="30" y="188" font-size="15" font-weight="700" fill="#ffffff">Decision Tree</text>
    <text x="30" y="207" font-size="11" fill="#8d99ae">AUC 0.833 ★</text>
    <rect x="180" y="168" height="24" rx="6" fill="url(#rec)" width="0">
      <animate attributeName="width" from="0" to="382.35" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="572" y="186" font-size="13" fill="#00f5d4" opacity="0">0.765
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze"/>
    </text>
    <rect x="180" y="198" height="24" rx="6" fill="url(#pre)" width="0">
      <animate attributeName="width" from="0" to="261.45" dur="1.4s" begin="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="452" y="216" font-size="13" fill="#fcbf49" opacity="0">0.523
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.8s" fill="freeze"/>
    </text>

    <!-- KNN -->
    <text x="30" y="268" font-size="15" font-weight="700" fill="#ffffff">KNN</text>
    <text x="30" y="287" font-size="11" fill="#8d99ae">AUC 0.765</text>
    <rect x="180" y="248" height="24" rx="6" fill="url(#rec)" width="0">
      <animate attributeName="width" from="0" to="363.65" dur="1.4s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="553" y="266" font-size="13" fill="#00f5d4" opacity="0">0.727
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.0s" fill="freeze"/>
    </text>
    <rect x="180" y="278" height="24" rx="6" fill="url(#pre)" width="0">
      <animate attributeName="width" from="0" to="230.1" dur="1.4s" begin="0.95s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="420" y="296" font-size="13" fill="#fcbf49" opacity="0">0.460
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
    </text>

    <!-- SVM -->
    <text x="30" y="348" font-size="15" font-weight="700" fill="#ffffff">SVM</text>
    <text x="30" y="367" font-size="11" fill="#8d99ae">AUC 0.820 • 9.3s</text>
    <rect x="180" y="328" height="24" rx="6" fill="url(#rec)" width="0">
      <animate attributeName="width" from="0" to="363.65" dur="1.4s" begin="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="553" y="346" font-size="13" fill="#00f5d4" opacity="0">0.727
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.4s" fill="freeze"/>
    </text>
    <rect x="180" y="358" height="24" rx="6" fill="url(#pre)" width="0">
      <animate attributeName="width" from="0" to="267.7" dur="1.4s" begin="1.35s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    </rect>
    <text x="458" y="376" font-size="13" fill="#fcbf49" opacity="0">0.535 ★ best precision
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.6s" fill="freeze"/>
    </text>
  </g>
</svg>
